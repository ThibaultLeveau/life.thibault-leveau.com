site_name: Life · Documentation
site_description: Architecture, développement et exploitation de Life.
site_url: https://life.thibault-leveau.com/documentation/
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
hooks:
  - scripts/documentation.py
exclude_docs: |
  theme/
theme:
  name: material
  custom_dir: docs/theme
  language: fr
  font: false
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang:
        - fr
        - en
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ThibaultLeveau/life.thibault-leveau.com
      name: Code source sur GitHub
    - icon: material/home-outline
      link: https://life.thibault-leveau.com/
      name: Ouvrir Life
  documentation_guides:
    - id: directory
      fr: Documentation
      en: Documentation
      chapters:
        - {file: index.md, fr: Choisir une documentation, en: Choose a guide}
    - id: general
      fr: Général
      en: General
      chapters:
        - {file: applications.md, fr: Compte et applications, en: Account and applications}
        - {file: assistant.md, fr: Assistant et mémoire, en: Assistant and memory}
        - {file: settings.md, fr: Réglages généraux, en: General settings}
        - {file: progression.md, fr: Réussites et progression, en: Achievements and progress}
    - id: tasks
      fr: Tâches
      en: Tasks
      chapters:
        - {file: taches.md, fr: Guide des tâches, en: Tasks guide}
    - id: sport
      fr: Sport
      en: Sport
      chapters:
