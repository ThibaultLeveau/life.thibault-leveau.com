name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: make install
      - name: Check code
        run: make check
      - name: Test backend and routing
        run: make test
      - name: Build frontend and documentation
        run: make build
      - name: Validate production image
        run: make docker-build
      - name: Install browser for acceptance tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test container, browser and backup restoration
        run: make test-container
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
          retention-days: 7
