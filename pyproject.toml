[project]
name = "life-app"
version = "0.1.0"
description = "Life — espace personnel, API FastAPI et interface React."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.8,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/life_app"]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.6,<10.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
