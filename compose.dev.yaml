name: life-development

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: life
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life-development-only
    ports:
      - '127.0.0.1:8102:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U life -d life']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
